<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230B6E99'><path d='M19 10.5h-4.5V6h-5v4.5H5v5h4.5V20h5v-4.5H19v-5z'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MediCare Hospital - Advanced Hospital Network, Doctor Booking, and Clinical Care Management." />
    <title>MediCare Hospital — Compassionate Care. Advanced Healthcare.</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      /* Pre-React standalone loading screen */
      .app-loader-container {
        position: fixed;
        inset: 0;
        background: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      }
      .app-loader-logo {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        animation: logoPulse 1.8s ease-in-out infinite;
      }
      .app-loader-icon {
        width: 72px;
        height: 72px;
        background: linear-gradient(135deg, #0B6E99 0%, #16A6A3 100%);
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #ffffff;
        box-shadow: 0 12px 30px rgba(11, 110, 153, 0.35);
      }
      .app-loader-title {
        font-size: 26px;
        font-weight: 800;
        color: #0c4a6e;
        letter-spacing: -0.5px;
      }
      @keyframes logoPulse {
        0%, 100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(1.04);
          opacity: 0.85;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Initial HTML Splash Screen - Logo Only -->
      <div class="app-loader-container">
        <div class="app-loader-logo">
          <div class="app-loader-icon">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
              <path d="M12 5v14"/>
              <path d="M5 12h14"/>
            </svg>
          </div>
          <div class="app-loader-title">MediCare</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
